<title>Rough Week to Record</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
/* ---------------------------------------------------------------------------
   The record is a drawing set.

   Tokens are lifted straight from the PEDR app so this page and the app are
   one system, not two. Colour is rationed: the page is ink on paper, and red
   means late / missing / wrong and nothing else. The density ramp is ink too,
   validated as an ordinal scale — monotone lightness, adjacent ΔL ≥ 0.06, and
   a light end that clears 2:1 against the surface it actually sits on.
--------------------------------------------------------------------------- */
:root{
  color-scheme: light;
  --paper:#eceae5; --sheet:#fbfaf8; --sheet-2:#f2f0eb; --sunk:#e4e1da;
  --ink:#16150f; --ink-2:#55534a; --ink-3:#8a877c;
  --hair:#d6d3ca; --hair-2:#b4b0a4;
  --revision:#d03b3b; --revision-ink:#a12020; --revision-wash:#fbeeee;
  --signed:#0ca30c; --signed-ink:#086b08;
  --pending-ink:#8a5710;
  --d1:#aca698; --d2:#837d6d; --d3:#5b5648; --d4:#38342b; --d5:#16150f;
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0b0b0c; --sheet:#151517; --sheet-2:#1d1d20; --sunk:#0f0f11;
    --ink:#f2f1ee; --ink-2:#a9a79f; --ink-3:#77746c;
    --hair:#2a2a2d; --hair-2:#3d3d41;
    --revision:#e05a5a; --revision-ink:#f08c8c; --revision-wash:#2a1616;
    --signed:#2fbc2f; --signed-ink:#62d162;
    --pending-ink:#e8b463;
    --d1:#55555c; --d2:#74747d; --d3:#96969f; --d4:#bcbcc4; --d5:#e9e9ee;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0b0b0c; --sheet:#151517; --sheet-2:#1d1d20; --sunk:#0f0f11;
  --ink:#f2f1ee; --ink-2:#a9a79f; --ink-3:#77746c;
  --hair:#2a2a2d; --hair-2:#3d3d41;
  --revision:#e05a5a; --revision-ink:#f08c8c; --revision-wash:#2a1616;
  --signed:#2fbc2f; --signed-ink:#62d162;
  --pending-ink:#e8b463;
  --d1:#55555c; --d2:#74747d; --d3:#96969f; --d4:#bcbcc4; --d5:#e9e9ee;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
p{margin:0}
a{color:inherit}
::selection{background:var(--ink);color:var(--sheet)}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1140px;margin:0 auto;padding:22px 18px 60px}

.label{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;
       text-transform:uppercase;color:var(--ink-3);line-height:1.4;display:block}
.ref{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-2);
     font-variant-numeric:tabular-nums}
h1{margin:0;font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:300;letter-spacing:-.02em;
   line-height:1.1;text-wrap:balance}
h2{margin:0;font-size:1rem;font-weight:500;letter-spacing:-.01em}
.dim{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:.86rem} .tiny{font-size:.78rem}

.titleblock{display:flex;border:1px solid var(--hair-2);background:var(--sheet);
            border-radius:2px;overflow:hidden;margin-bottom:20px}
.titleblock>div{flex:1 1 0;padding:8px 13px;border-right:1px solid var(--hair);min-width:0}
.titleblock>div:last-child{border-right:0}
.titleblock .value{font-family:var(--mono);font-size:.8rem;color:var(--ink);
                   white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
@media (max-width:820px){
  .titleblock{flex-wrap:wrap}
  .titleblock>div{flex:1 1 45%;border-bottom:1px solid var(--hair);border-right:1px solid var(--hair)}
}

.sheet{background:var(--sheet);border:1px solid var(--hair);border-radius:2px;padding:16px}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
            padding-bottom:9px;margin-bottom:13px;border-bottom:1px solid var(--hair)}

/* The working surface: input at the left, what the engine made of it at the right. */
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}

textarea{width:100%;min-height:270px;padding:12px;border:1px solid var(--hair-2);
         border-radius:2px;background:var(--sheet);color:var(--ink);
         font-family:var(--sans);font-size:15px;line-height:1.65;resize:vertical}
textarea:focus{outline:none;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:2px;
     border:1px solid var(--hair-2);background:transparent;color:var(--ink);
     font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
     cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sheet-2);border-color:var(--ink-3)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border:1px solid var(--hair-2);
      border-radius:2px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
      text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.chip-ink{border-color:var(--ink);color:var(--ink)}
.chip-rev{border-color:var(--revision);color:var(--revision-ink)}

.mark{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
      font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.mark::before{content:'';width:6px;height:6px;border:1px solid currentColor;flex:none}
.mark-yes{color:var(--signed-ink)}
.mark-yes::before{background:currentColor;border-radius:50%}
.mark-no{color:var(--revision-ink)}
.mark-no::before{transform:rotate(45deg);background:currentColor}

/* One parsed entry, drawn as a filed record. */
.entry{border:1px solid var(--hair);border-radius:2px;background:var(--sheet);padding:11px 12px}
.entry+.entry{margin-top:7px}
.entry-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.entry-act{font-size:.92rem;line-height:1.45}
.entry-line{display:flex;gap:7px;margin-top:6px;font-size:.82rem;line-height:1.5}
.entry-line .label{flex:none;width:52px;padding-top:2px}
.wrong{color:var(--revision-ink)}
.learned{color:var(--signed-ink)}
.prov{margin-top:8px;padding-top:7px;border-top:1px dashed var(--hair);
      font-family:var(--mono);font-size:10px;color:var(--ink-3);
      overflow:hidden;text-overflow:ellipsis}

/* The score, with its working shown. */
.score-top{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.score-fig{font-size:2.6rem;font-weight:300;letter-spacing:-.03em;line-height:1;
           font-variant-numeric:tabular-nums}
.crit{display:flex;align-items:baseline;gap:9px;padding:6px 0;border-top:1px solid var(--hair)}
.crit:first-of-type{border-top:0}
.crit-pts{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
          color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

.strip{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;max-width:340px}
.cell{aspect-ratio:1;border:1px solid transparent;background:var(--sunk)}
.cell[data-d="0"]{background:transparent;border-color:var(--hair-2);border-style:dashed}
.cell[data-d="1"]{background:var(--d1)} .cell[data-d="2"]{background:var(--d2)}
.cell[data-d="3"]{background:var(--d3)} .cell[data-d="4"]{background:var(--d4)}
.cell[data-d="5"]{background:var(--d5)}

.note{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--hair);
      border-left:2px solid var(--ink-3);border-radius:2px;background:var(--sheet);
      font-size:.86rem;color:var(--ink-2);line-height:1.55}
.note strong{color:var(--ink);font-weight:500}
.note-rev{border-left-color:var(--revision);background:var(--revision-wash)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.empty{padding:26px 12px;text-align:center;color:var(--ink-3);font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style>
